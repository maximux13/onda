[package]
name = "onda"
version = "0.2.0"
edition = "2024"
description = "Native macOS menu bar per-app volume mixer and 10-band equalizer built in Rust with GPUI"
license = "MIT"

[dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
global-hotkey = "0.7"
tray-icon = "0.26.1"
objc2 = "0.6"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
thiserror = "2"
self_update = { version = "1.3.3", default-features = false, features = ["archive-zip", "compression-zip-deflate", "github", "reqwest", "rustls"] }

[lints.rust]
future_incompatible = "warn"
nonstandard_style = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
redundant_clone = "warn"

[dev-dependencies]
zip = { version = "9.7.0", default-features = false, features = ["deflate"] }
